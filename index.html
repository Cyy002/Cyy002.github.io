:root {
  --page: #f5f5f7;
  --surface: #ffffff;
  --ink: #1d1d1f;
  --muted: #6e6e73;
  --soft-muted: #8e8e93;
  --line: rgba(0, 0, 0, .09);
  --dark: #050506;
  --radius-sm: 18px;
  --radius-md: 30px;
  --radius-lg: 54px;
  --max: 1240px;
  --header-max: 980px;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --shadow-soft: 0 18px 70px rgba(0,0,0,.07);
}

  <style>
* { box-sizing: border-box; }
html { scroll-behavior: smooth; background: var(--page); }
body {
  margin: 0;
  color: var(--ink);
  background: var(--page);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button, input, textarea { font: inherit; }
button { color: inherit; }
img { display: block; max-width: 100%; }

.section-pad { width: min(calc(100% - 48px), var(--max)); margin-inline: auto; }
.eyebrow { margin: 0; color: var(--soft-muted); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.display-sm { margin: 12px 0 0; font-size: clamp(48px, 6vw, 84px); line-height: .96; letter-spacing: -.055em; }
.display-lg { margin: 14px 0 0; font-size: clamp(64px, 8.5vw, 124px); line-height: .9; letter-spacing: -.065em; }

.reveal, .reveal-blur {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity .8s var(--ease), transform .8s var(--ease), filter .8s var(--ease);
}
.reveal-blur { filter: blur(16px); transform: translateY(34px) scale(.985); }
.reveal.in-view, .reveal-blur.in-view { opacity: 1; transform: none; filter: blur(0); }
.split-reveal {
  background: linear-gradient(90deg, #1d1d1f 0 48%, #b9b9be 52% 100%);
  background-size: 220% 100%;
  background-position: 100% 0;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  transition: background-position 1.4s var(--ease);
}
.split-reveal.in-view { background-position: 0 0; }

.site-header { position: fixed; z-index: 100; left: 50%; top: 16px; width: min(calc(100% - 28px), var(--header-max)); transform: translateX(-50%); }

  border-radius: 999px;

.mobile-menu.open { display: block; }

.pill:hover { transform: translateY(-2px); }

/* Language control: intentionally compact so it reads like a system control, not a CTA. */

  padding: 0 11px;
  border: 1px solid rgba(0,0,0,.055);
  border-radius: 999px;
  background: rgba(255,255,255,.58);
  color: #343438;
  font: inherit;
  font-size: 11px;

  <style>
/* Premium interaction effects. Content lives in /data; effects can be disabled there. */
.pointer-glow {
  --x: 50vw; --y: 20vh;
  position: fixed; width: 420px; height: 420px; left: var(--x); top: var(--y);
  transform: translate(-50%,-50%); border-radius: 50%; pointer-events: none; z-index: 0; opacity: .18;
  background: radial-gradient(circle,rgba(118,184,255,.26),rgba(195,159,255,.13) 34%,transparent 68%);
  filter: blur(20px); transition: opacity .35s ease;
}
body.pointer-idle .pointer-glow { opacity: .08; }
main { position: relative; z-index: 1; }

/* Morphing glass navigation */
.site-header { transition: width .55s var(--ease),top .55s var(--ease); }
.site-header.is-scrolled { width: min(calc(100% - 36px),760px); top: 10px; }
.nav-shell { transition: min-height .55s var(--ease),background .35s ease,box-shadow .35s ease,border-color .35s ease; }
.site-header.is-scrolled .nav-shell { min-height: 46px; background: rgba(245,245,247,.78); border-color: rgba(255,255,255,.76); box-shadow: 0 14px 50px rgba(0,0,0,.09); }

/* Hero micro-motion */
.hero-mesh {
  position: absolute; inset: 5% -15% auto; height: 75%; pointer-events: none; opacity: .26;
  background-image: linear-gradient(rgba(0,0,0,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.04) 1px,transparent 1px);
  background-size: 72px 72px;
  mask-image: radial-gradient(circle at 50% 50%,black 0 18%,transparent 68%);
  -webkit-mask-image: radial-gradient(circle at 50% 50%,black 0 18%,transparent 68%);
  transform: perspective(700px) rotateX(64deg) translateY(-8%);
}
.hero-glass-orbit { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.orbit-note {
  position: absolute; padding: 9px 13px; border: 1px solid rgba(255,255,255,.65); border-radius: 999px;
  background: rgba(255,255,255,.42); box-shadow: 0 16px 45px rgba(0,0,0,.06);
  backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%);
  color: rgba(29,29,31,.66); font-size: 11px; font-weight: 700; letter-spacing: .02em;
  animation: orbitFloat 5s ease-in-out infinite;
}
.orbit-note-1 { left: 7%; top: 34%; animation-delay: -.4s; }
.orbit-note-2 { right: 8%; top: 30%; animation-delay: -1.6s; }
.orbit-note-3 { left: 15%; bottom: 22%; animation-delay: -2.7s; }
.orbit-note-4 { right: 13%; bottom: 21%; animation-delay: -3.7s; }
@keyframes orbitFloat { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-12px) rotate(1deg); } }

/* Pointer-following card light */
.spotlight-card { position: relative; isolation: isolate; }
.card-spotlight {
  position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 0; opacity: 0;
  background: radial-gradient(360px circle at var(--spot-x,50%) var(--spot-y,50%),rgba(255,255,255,.78),transparent 48%);
  transition: opacity .25s ease;
}
.spotlight-card > *:not(.card-spotlight) { position: relative; z-index: 1; }
.spotlight-card:hover .card-spotlight { opacity: .68; }

.magnetic { will-change: transform; }

/* Contact ambient motion */
.contact-glow { transform: translate3d(var(--contact-x,0px),var(--contact-y,0px),0); }
.contact-glow-b {
  width: 560px; height: 560px; left: -120px; right: auto; top: auto; bottom: -180px;
  background: radial-gradient(circle at 50% 50%,rgba(255,205,228,.75),rgba(198,221,255,.42) 42%,transparent 68%); opacity: .54;
}

/* Dynamic-Island-inspired music control */
.music-dock { position: fixed; right: 18px; bottom: 18px; z-index: 120; }
.music-pill {
  width: 58px; min-height: 58px; border: 1px solid rgba(255,255,255,.12); border-radius: 24px; padding: 8px; overflow: hidden;
  background: rgba(15,15,17,.94); color: white; box-shadow: 0 18px 50px rgba(0,0,0,.24);
  backdrop-filter: blur(24px) saturate(150%); -webkit-backdrop-filter: blur(24px) saturate(150%);
  transition: width .55s var(--ease),border-radius .55s var(--ease),background .3s ease;
}
.music-pill:hover,.music-pill.expanded { width: 178px; border-radius: 24px; }
.music-head { display: grid; grid-template-columns: 42px 1fr; align-items: center; gap: 0; min-height: 42px; }
.music-toggle { width: 42px; height: 42px; border: 0; border-radius: 16px; background: linear-gradient(145deg,#333338,#121214); display: grid; place-items: center; cursor: pointer; padding: 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.07); }
.equalizer { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; gap: 2px; }
.equalizer i { display: block; width: 2px; height: 5px; border-radius: 999px; background: white; opacity: .82; transform-origin: bottom; }
.music-pill.is-playing .equalizer i:nth-child(1) { animation: eq .7s ease-in-out infinite alternate; }
.music-pill.is-playing .equalizer i:nth-child(2) { animation: eq .46s ease-in-out infinite alternate-reverse; }
.music-pill.is-playing .equalizer i:nth-child(3) { animation: eq .58s ease-in-out infinite alternate; }
.music-pill.is-playing .equalizer i:nth-child(4) { animation: eq .8s ease-in-out infinite alternate-reverse; }
@keyframes eq { from { transform: scaleY(.7); } to { transform: scaleY(2.7); } }
.music-copy { min-width: 0; opacity: 0; transform: translateX(10px); transition: opacity .28s ease .12s,transform .4s var(--ease) .08s; white-space: nowrap; overflow: hidden; }
.music-pill:hover .music-copy,.music-pill.expanded .music-copy { opacity: 1; transform: none; }
.music-copy strong { display:block; overflow:hidden; text-overflow:ellipsis; font-size:13px; font-weight:650; letter-spacing:-.01em; }
.music-state { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }


@media (max-width: 760px) {
  .pointer-glow { display: none; }
  .orbit-note { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .orbit-note,.equalizer i { animation: none !important; }
}

/* Traditional Chinese: stricter CJK line breaking and Apple-like density. */
html[lang="zh-Hant"] body {
  line-break: strict;
  word-break: normal;
  font-family: -apple-system,BlinkMacSystemFont,"PingFang TC","SF Pro Text","Helvetica Neue","Noto Sans TC","Microsoft JhengHei",sans-serif;

html[lang="zh-Hant"] h2,

window.PortfolioLanguage = (() => {
  const supported = ['en', 'zh'];
  let currentLanguage = 'en';

  /*
    English is intentionally the default on every fresh page load.
    A language toggle is passed through sessionStorage for exactly one reload,
    then consumed immediately. This lets the bilingual switch work while
    ensuring that a later refresh / reopen always starts in English.
  */
  function readInitialLanguage() {
    try {
      const requested = sessionStorage.getItem('ethan-portfolio-next-language');
      sessionStorage.removeItem('ethan-portfolio-next-language');
      if (supported.includes(requested)) return requested;
    } catch (_) {}
    return window.SITE_DATA.defaultLanguage || 'en';
  }

  function current() {
    return currentLanguage;
  }

  function copy() {
    return window.PORTFOLIO_LOCALES[currentLanguage] || window.PORTFOLIO_LOCALES.en;
  }

  function init() {
    currentLanguage = readInitialLanguage();
    document.documentElement.lang = currentLanguage === 'zh' ? 'zh-Hant' : 'en';
    const button = document.querySelector('#language-toggle');
    if (button) {
      button.textContent = copy().languageButton;
      button.setAttribute('aria-label', currentLanguage === 'en' ? '切換為中文' : 'Switch to English');
      button.addEventListener('click', () => {
        const next = currentLanguage === 'en' ? 'zh' : 'en';
        try {
          sessionStorage.setItem('ethan-portfolio-scroll', String(window.scrollY));
          sessionStorage.setItem('ethan-portfolio-next-language', next);
        } catch (_) {}
        document.documentElement.classList.add('language-switching');
        setTimeout(() => location.reload(), matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 150);
      });
    }

    requestAnimationFrame(() => {
      try {
        const savedY = Number(sessionStorage.getItem('ethan-portfolio-scroll'));
        if (Number.isFinite(savedY) && savedY > 0) {
          sessionStorage.removeItem('ethan-portfolio-scroll');
          scrollTo(0, savedY);
        }
      } catch (_) {}
    });
  }

  return { init, current, copy };
})();

  <script>
/* Scroll / entrance animation observers only. */
window.PortfolioAnimations = (() => {
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

  function initReveal() {
    const threshold = window.SITE_DATA.motion.revealThreshold ?? .16;
    const targets = document.querySelectorAll('.reveal, .reveal-blur, .split-reveal');

    if (!('IntersectionObserver' in window) || reduced()) {
      targets.forEach(el => el.classList.add('in-view'));
      return;
    }

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('in-view');
        observer.unobserve(entry.target);
      });
    }, { threshold, rootMargin: '0px 0px -5% 0px' });

    targets.forEach(el => observer.observe(el));
  }

  function initHeroParallax() {
    if (reduced() || !window.SITE_DATA.motion.heroParallax) return;
    const title = document.querySelector('.hero-title');
    const sub = document.querySelector('.hero-sub');
    if (!title || !sub) return;

    let ticking = false;
    const update = () => {
      const y = Math.min(scrollY, innerHeight);
      title.style.transform = `translateY(${y * .052}px) scale(${1 - y / innerHeight * .032})`;
      sub.style.transform = `translateY(${y * .032}px)`;
      ticking = false;
    };
    const request = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(update);
    };

    addEventListener('scroll', request, { passive: true });
    addEventListener('resize', request, { passive: true });
    update();
  }

  function initMediaMotion() {
    if (reduced()) return;
    const media = [...document.querySelectorAll('.media-card, .about-photo')];
    if (!media.length) return;

    let ticking = false;
    const update = () => {
      media.forEach(el => {
        const rect = el.getBoundingClientRect();
        if (rect.bottom < -120 || rect.top > innerHeight + 120) return;
        const center = rect.top + rect.height / 2;
        const delta = (center - innerHeight / 2) / innerHeight;
        el.style.setProperty('--media-y', `${Math.max(-14, Math.min(14, -delta * 16)).toFixed(2)}px`);
      });
      ticking = false;
    };
    const request = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(update);
    };

    addEventListener('scroll', request, { passive: true });
    addEventListener('resize', request, { passive: true });
    update();
  }

  function initAutoplayVideo() {
    const video = document.querySelector('[data-autoplay-video]');
    if (!video) return;

    const card = video.closest('.robot-film');
    const sources = [...video.querySelectorAll('source[data-src]')];
    let loaded = false;
    let visible = false;

    const ensureLoaded = () => {
      if (loaded || !sources.length) return;
      sources.forEach(source => {
        if (!source.dataset.src) return;
        source.src = source.dataset.src;
        source.removeAttribute('data-src');
      });
      video.load();
      loaded = true;
    };

    const markReady = () => card?.classList.add('is-video-ready');
    video.addEventListener('loadeddata', markReady, { once: true });
    video.addEventListener('canplay', markReady, { once: true });
    video.addEventListener('error', () => card?.classList.remove('is-video-ready'));

    const syncPlayback = () => {
      if (!loaded || reduced() || document.hidden || !visible) {
        video.pause();
        return;
      }
      const playPromise = video.play();
      if (playPromise?.catch) playPromise.catch(() => {});
    };

    if (!('IntersectionObserver' in window)) {
      ensureLoaded();
      visible = true;
      syncPlayback();
      return;
    }

    const loader = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        ensureLoaded();
        loader.disconnect();
      });
    }, { rootMargin: '1200px 0px' });
    loader.observe(video);

    const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    const canPrefetch = !connection?.saveData && !/2g/i.test(connection?.effectiveType || '');
    if (canPrefetch) {
      const schedulePrefetch = () => {
        if ('requestIdleCallback' in window) requestIdleCallback(ensureLoaded, { timeout: 2500 });
        else setTimeout(ensureLoaded, 1200);
      };
      schedulePrefetch();
    }

    const playback = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        visible = entry.isIntersecting && entry.intersectionRatio >= .22;
        if (visible) ensureLoaded();
        syncPlayback();
      });
    }, { threshold: [0, .22, .65] });
    playback.observe(video);

    document.addEventListener('visibilitychange', syncPlayback);
  }

  function initAll() {
    initReveal();
    initHeroParallax();
    initMediaMotion();
    initAutoplayVideo();
  }

  return { initAll };
})();

  <script>
/* Small UI behaviors only. */
window.PortfolioInteractions = (() => {
  function initMobileMenu() {
    const button = document.querySelector('.menu-button');
    const menu = document.querySelector('.mobile-menu');
    if (!button || !menu) return;

    const close = () => {
      button.setAttribute('aria-expanded', 'false');
      button.setAttribute('aria-label', window.PortfolioLanguage.copy().a11y?.openMenu || 'Open menu');
      menu.classList.remove('open');
      menu.setAttribute('aria-hidden', 'true');
    };

    const open = () => {
      button.setAttribute('aria-expanded', 'true');
      button.setAttribute('aria-label', window.PortfolioLanguage.copy().a11y?.closeMenu || 'Close menu');
      menu.classList.add('open');
      menu.setAttribute('aria-hidden', 'false');
    };

    button.addEventListener('click', event => {
      event.stopPropagation();
      button.getAttribute('aria-expanded') === 'true' ? close() : open();
    });

    menu.querySelectorAll('a').forEach(link => link.addEventListener('click', close));
    document.addEventListener('click', event => {
      if (button.getAttribute('aria-expanded') !== 'true') return;
      if (!menu.contains(event.target) && !button.contains(event.target)) close();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') close();
    });
    addEventListener('resize', () => {
      if (innerWidth > 760) close();
    }, { passive: true });
  }

  function initScrollProgress() {
    const progress = document.querySelector('.scroll-progress span');
    if (!progress) return;
    let ticking = false;

    const update = () => {
      const max = document.documentElement.scrollHeight - innerHeight;
      progress.style.width = `${max > 0 ? Math.max(0, Math.min(100, (scrollY / max) * 100)) : 0}%`;
      ticking = false;
    };
    const request = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(update);
    };

    addEventListener('scroll', request, { passive: true });
    addEventListener('resize', request, { passive: true });
    update();
  }

  function initActiveNavigation() {
    if (!('IntersectionObserver' in window)) return;
    const ids = [...document.querySelectorAll('[data-nav-target]')]
      .map(link => link.dataset.navTarget)
      .filter((id, index, arr) => id && arr.indexOf(id) === index);
    const sections = ids.map(id => document.getElementById(id)).filter(Boolean);
    if (!sections.length) return;

    const setActive = (id) => {
      document.querySelectorAll('[data-nav-target]').forEach(link => {
        if (link.dataset.navTarget === id) link.setAttribute('aria-current', 'location');
        else link.removeAttribute('aria-current');
      });
    };

    let current = null;
    const observer = new IntersectionObserver(entries => {
      const candidates = entries
        .filter(entry => entry.isIntersecting)
        .sort((a, b) => b.intersectionRatio - a.intersectionRatio);
      if (!candidates.length) return;
      const id = candidates[0].target.id;
      if (id && id !== current) {
        current = id;
        setActive(id);
      }
    }, { rootMargin: '-28% 0px -58% 0px', threshold: [0, .01, .2, .5] });

    sections.forEach(section => observer.observe(section));
  }

  function initAll() {
    initMobileMenu();
    initScrollProgress();
    initActiveNavigation();
  }

  return { initAll };
})();

  <script>
/* Optional premium effects. Each feature is isolated and safe to disable in data/site.js. */
window.PortfolioEffects = (() => {
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const motion = () => window.SITE_DATA.motion || {};

  function initNavMorph() {
    if (!motion().navMorph) return;
    const header = document.querySelector('.site-header');
    if (!header) return;
    const update = () => header.classList.toggle('is-scrolled', scrollY > 72);
    update();
    addEventListener('scroll', update, { passive: true });
  }

  function initPointerGlow() {
    if (!motion().pointerGlow || reduced() || matchMedia('(pointer: coarse)').matches) return;
    const glow = document.querySelector('.pointer-glow');
    if (!glow) return;
    let idleTimer;
    addEventListener('pointermove', event => {
      glow.style.setProperty('--x', `${event.clientX}px`);
      glow.style.setProperty('--y', `${event.clientY}px`);
      document.body.classList.remove('pointer-idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => document.body.classList.add('pointer-idle'), 1400);
    }, { passive: true });
  }

  function initCardSpotlight() {
    if (!motion().cardSpotlight || matchMedia('(pointer: coarse)').matches) return;
    document.querySelectorAll('.spotlight-card').forEach(card => {
      card.addEventListener('pointermove', event => {
        const rect = card.getBoundingClientRect();
        card.style.setProperty('--spot-x', `${event.clientX - rect.left}px`);
        card.style.setProperty('--spot-y', `${event.clientY - rect.top}px`);
      });
    });
  }

  function initMagneticControls() {
    if (reduced() || matchMedia('(pointer: coarse)').matches) return;
    document.querySelectorAll('[data-magnetic].magnetic').forEach(el => {
      el.addEventListener('pointermove', event => {
        const rect = el.getBoundingClientRect();
        const x = Math.max(-7, Math.min(7, (event.clientX - rect.left - rect.width / 2) * .08));
        const y = Math.max(-6, Math.min(6, (event.clientY - rect.top - rect.height / 2) * .10));
        el.style.transform = `translate3d(${x}px,${y}px,0)`;
      });
      el.addEventListener('pointerleave', () => { el.style.transform = ''; });
    });
  }

  function initPrincipleScrub() {
    if (!motion().principleScrub) return;
    const section = document.querySelector('#principles');
    const sticky = section?.querySelector('.principles-sticky');
    const words = [...section?.querySelectorAll('[data-principle-word]') || []];
    const steps = [...section?.querySelectorAll('[data-principle-step]') || []];
    if (!section || !sticky) return;

    let ticking = false;
    const update = () => {
      const rect = section.getBoundingClientRect();
      const travel = Math.max(1, section.offsetHeight - innerHeight);
      const progress = Math.max(0, Math.min(1, -rect.top / travel));
      sticky.style.setProperty('--principle-aura-scale', (0.72 + progress * 0.28).toFixed(3));
      sticky.style.setProperty('--principle-aura-opacity', (0.55 + progress * 0.40).toFixed(3));
      sticky.style.setProperty('--principle-device-opacity', (0.30 + progress * 0.70).toFixed(3));
      sticky.style.setProperty('--principle-device-x', `${((0.5 - progress) * 50).toFixed(1)}px`);
      sticky.style.setProperty('--principle-device-y', `${((0.5 - progress) * -35).toFixed(1)}px`);
      sticky.style.setProperty('--principle-device-scale', (0.74 + progress * 0.22).toFixed(3));
      sticky.style.setProperty('--principle-core-rotate', `${(-8 + progress * 16).toFixed(2)}deg`);
      const phaseCount = Math.max(1, Math.max(words.length, steps.length));
      const activeIndex = Math.min(phaseCount - 1, Math.floor(progress * phaseCount));
      words.forEach((word, index) => word.classList.toggle('active', index <= activeIndex));
      steps.forEach((step, index) => step.classList.toggle('active', index === activeIndex));
      ticking = false;
    };
    const request = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(update);
    };
    update();
    addEventListener('scroll', request, { passive: true });
    addEventListener('resize', request, { passive: true });
  }

  function initContactDrift() {
    if (reduced() || matchMedia('(pointer: coarse)').matches) return;
    const contact = document.querySelector('#contact');
    if (!contact) return;
    contact.addEventListener('pointermove', event => {
      const rect = contact.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width - .5) * 36;
      const y = ((event.clientY - rect.top) / rect.height - .5) * 28;
      contact.style.setProperty('--contact-x', `${x.toFixed(2)}px`);
      contact.style.setProperty('--contact-y', `${y.toFixed(2)}px`);
    });
    contact.addEventListener('pointerleave', () => {
      contact.style.setProperty('--contact-x', '0px');
      contact.style.setProperty('--contact-y', '0px');
    });
  }

  function initAll() {
    initNavMorph();
    initPointerGlow();
    initCardSpotlight();
    initMagneticControls();
    initPrincipleScrub();
    initContactDrift();
  }

  return { initAll };
})();

  <script>
/*
  Background music controller

  Uses Terror Jr's official SoundCloud track through the SoundCloud Widget API.
  The copyrighted audio file is NOT bundled with this site.

  Browsers may block audible autoplay until the visitor interacts with the page.
  We still request playback immediately; if it is blocked, the first pointer,
  touch, keyboard, scroll/wheel interaction retries playback from startAt.
*/
window.PortfolioMusic = (() => {
  let widget = null;
  let iframe = null;
  let ready = false;
  let wantsPlayback = true;
  let playing = false;
  let gestureListenersInstalled = false;
  let verifyTimer = null;
  let suspendedByVisibility = false;

  function clampVolume(v) {
    return Math.max(0, Math.min(100, Math.round(Number(v ?? 0.08) * 100)));
  }

  function copy() {
    return window.PortfolioLanguage?.copy?.().music || window.PORTFOLIO_LOCALES.en.music;
  }

  function init() {
    const config = window.SITE_DATA.music || {};
    const mount = document.querySelector('#music-dock');
    if (!config.enabled || !mount) return;

    const startAt = Math.max(0, Number(config.startAt || 0));
    const startAtMs = Math.round(startAt * 1000);
    const volume = clampVolume(config.volume);

    mount.className = 'music-dock';
    mount.innerHTML = `
      <div class="music-pill expanded" id="music-pill">
        <div class="music-head">
          <button class="music-toggle" type="button" aria-label="${copy().playAria}" aria-pressed="false">
            <span class="equalizer" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          </button>
          <div class="music-copy">
            <strong>${config.title || 'Background music'}</strong>
            <div class="music-state" aria-live="polite"></div>
          </div>
        </div>
        <div class="soundcloud-audio-host" aria-hidden="true"></div>
      </div>`;

    const pill = mount.querySelector('.music-pill');
    const button = mount.querySelector('.music-toggle');
    const state = mount.querySelector('.music-state');
    const host = mount.querySelector('.soundcloud-audio-host');

    function setUi(mode, message) {
      playing = mode === 'playing';
      pill.classList.toggle('is-playing', playing);
      pill.classList.toggle('is-waiting', mode === 'waiting');
      button.setAttribute('aria-pressed', playing ? 'true' : 'false');
      button.setAttribute('aria-label', playing ? copy().pauseAria : copy().playAria);
      if (message && state) state.textContent = message;
    }

    function seekAndPlay({ restart = true } = {}) {
      if (!ready || !widget || !wantsPlayback) return;
      try {
        widget.setVolume(volume);
        if (restart) widget.seekTo(startAtMs);
        widget.play();
      } catch (_) {}

      clearTimeout(verifyTimer);
      verifyTimer = setTimeout(() => {
        if (!wantsPlayback || !widget) return;
        try {
          widget.isPaused((paused) => {
            if (paused === false) setUi('playing', copy().playing(startAt, volume));
            else setUi('waiting', copy().waiting);
          });
        } catch (_) {
          setUi('waiting', copy().waiting);
        }
      }, 900);
    }

    function installGestureUnlock() {
      if (gestureListenersInstalled) return;
      gestureListenersInstalled = true;

      const handler = (event) => {
        if (!wantsPlayback || playing || !ready) return;
        if (event?.target?.closest?.('.music-toggle')) return;
        seekAndPlay({ restart: true });
      };

      // A click/tap/keydown is the most reliable browser media activation.
      document.addEventListener('pointerdown', handler, true);
      document.addEventListener('touchstart', handler, true);
      document.addEventListener('keydown', handler, true);
    }

    button.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();

      if (!ready || !widget) {
        wantsPlayback = true;
        setUi('waiting', copy().waiting);
        return;
      }

      if (playing) {
        wantsPlayback = false;
        try { widget.pause(); } catch (_) {}
        setUi('paused', copy().paused);
      } else {
        wantsPlayback = true;
        seekAndPlay({ restart: true });
      }
    });

    setUi('waiting', copy().starting(startAt, volume));
    setTimeout(() => pill.classList.remove('expanded'), 3200);

    if (config.provider !== 'soundcloud' || !config.trackUrl) {
      setUi('paused', copy().unavailable);
      return;
    }

    const createWidget = () => {
      if (!window.SC?.Widget) {
        setUi('waiting', copy().waiting);
        return;
      }

      const src = 'https://w.soundcloud.com/player/?' + new URLSearchParams({
        url: config.trackUrl,
        auto_play: 'false',
        hide_related: 'true',
        show_comments: 'false',
        show_user: 'false',
        show_reposts: 'false',
        visual: 'false'
      }).toString();

      iframe = document.createElement('iframe');
      iframe.title = `${config.title || 'Background music'} — SoundCloud`;
      iframe.allow = 'autoplay';
      iframe.src = src;
      iframe.tabIndex = -1;
      iframe.style.position = 'absolute';
      iframe.style.width = '1px';
      iframe.style.height = '1px';
      iframe.style.opacity = '0';
      iframe.style.pointerEvents = 'none';
      iframe.style.border = '0';
      host.appendChild(iframe);

      widget = window.SC.Widget(iframe);

      widget.bind(window.SC.Widget.Events.READY, () => {
        ready = true;
        try { widget.setVolume(volume); } catch (_) {}
        wantsPlayback = config.autoplay !== false;
        if (!wantsPlayback) {
          setUi('paused', copy().paused);
          return;
        }
        seekAndPlay({ restart: true });
        installGestureUnlock();
      });

      widget.bind(window.SC.Widget.Events.PLAY, () => {
        try { widget.setVolume(volume); } catch (_) {}
        setUi('playing', copy().playing(startAt, volume));
      });

      widget.bind(window.SC.Widget.Events.PAUSE, () => {
        if (wantsPlayback && !playing) setUi('waiting', copy().waiting);
        else if (!wantsPlayback) setUi('paused', copy().paused);
      });

      widget.bind(window.SC.Widget.Events.FINISH, () => {
        if (!wantsPlayback) return;
        seekAndPlay({ restart: true });
      });

      widget.bind(window.SC.Widget.Events.ERROR, () => {
        playing = false;
        setUi('paused', copy().retry);
        pill.classList.add('expanded');
      });
    };

    installGestureUnlock();

    if (window.SC?.Widget) {
      createWidget();
    } else {
      const script = document.createElement('script');
      script.src = 'https://w.soundcloud.com/player/api.js';
      script.async = true;
      script.onload = createWidget;
      script.onerror = () => {
        setUi('paused', copy().unavailable);
        pill.classList.add('expanded');
      };
      document.head.appendChild(script);
    }

    document.addEventListener('visibilitychange', () => {
      if (!ready || !widget) return;
      if (document.hidden) {
        suspendedByVisibility = playing && wantsPlayback;
        try { widget.pause(); } catch (_) {}
        return;
      }
      if (suspendedByVisibility && wantsPlayback) {
        suspendedByVisibility = false;
        try {
          widget.setVolume(volume);
          widget.play();
        } catch (_) {
          setUi('waiting', copy().waiting);
        }
      }
    });

    document.addEventListener('portfolio:languagechange', () => {
      if (playing) setUi('playing', copy().playing(startAt, volume));
      else if (wantsPlayback) setUi('waiting', copy().waiting);
      else setUi('paused', copy().paused);
    });
  }

  return { init };
})();

</script>

  window.PortfolioLanguage.init();
  window.PortfolioRender.renderAll();
  window.PortfolioInteractions.initAll();
  window.PortfolioAnimations.initAll();
  window.PortfolioEffects.initAll();
  window.PortfolioMusic.init();
